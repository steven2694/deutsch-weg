:root{--g:#173d32;--g2:#285c4b;--gold:#a57b3b;--bg:#f5f3eb;--paper:#fffdf8;--ink:#26332d;--muted:#718078;--line:#e3e5db;--red:#a33e36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--g);color:white;padding:16px 18px calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}header .brand{font-weight:750;font-size:21px;letter-spacing:.2px}header small{opacity:.82}.wrap{max-width:860px;margin:auto;padding:15px 14px 105px}.view{display:none}.view.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #1b35200a}.hero{background:linear-gradient(135deg,#173d32,#315d4c);color:white;border-radius:20px;padding:20px;margin:12px 0}.hero p{opacity:.9}.muted,.hint{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--gold);font-weight:750;text-transform:uppercase}.title{font-size:23px;margin:3px 0 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#f4f3eb;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;color:var(--g)}button,.btn,select,input,textarea{font:inherit}button,.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g2);color:white;cursor:pointer}button.secondary{background:#edf0e9;color:var(--g)}button.ghost{background:transparent;color:var(--g);border:1px solid var(--line)}button.danger{background:#f8e9e6;color:var(--red)}button:disabled{opacity:.45}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:space-around;gap:2px;background:#fffdf8f2;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{background:transparent;color:#617068;padding:7px 5px;font-size:11px;min-width:0;flex:1}.nav button.active{background:#e9eee8;color:var(--g);font-weight:750}.word{font-size:21px;font-weight:750;color:var(--g)}.ipa{font-family:ui-monospace,SFMono-Regular,monospace;color:#9b7134;font-size:14px;display:block;overflow-wrap:anywhere}.translation{color:var(--muted)}.progress{height:8px;background:#e8eae2;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:#668b70}.lesson-item{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:white}.lesson-item h3{margin:0 0 4px;font-size:16px}.pill{display:inline-block;background:#edf0e9;color:var(--g);border-radius:30px;padding:3px 9px;font-size:11px;margin:2px}.vocab-item,.example{border-top:1px solid var(--line);padding:11px 0}.vocab-item:first-child,.example:first-child{border-top:0}.section-title{font-size:17px;margin:18px 0 6px}.explain{background:#f3f3ec;padding:12px;border-radius:12px}.q{padding:12px 0;border-top:1px solid var(--line)}.q label{display:block;background:#f3f4ee;border-radius:10px;padding:9px;margin:7px 0}.q input{margin-right:8px;accent-color:var(--g)}textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink)}textarea{min-height:95px}.progressbar{height:9px;background:#e7e9e1;border-radius:20px;overflow:hidden}.progressbar span{display:block;height:100%;background:#668b70}.small{font-size:12px}.hidden{display:none!important}.notice{padding:11px;border-radius:12px;background:#f7f0df;color:#66522f;font-size:13px}.success{color:#2c6a45}.danger-text{color:var(--red)}.alphabet{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.alphabet div{background:#f1f2eb;border-radius:9px;padding:8px;text-align:center}.alphabet b{display:block;font-size:18px;color:var(--g)}.empty{text-align:center;padding:25px;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.wrap{padding-top:22px}}

<script>const DATA={"lessons":[{"id":1,"level":"A1","day":1,"title":"字母名称与拼读姓名","goal":"认识德语字母名称，能够慢慢拼读自己的姓名和简单邮箱地址。","grammar":"字母名称；拼读时的礼貌表达","vocab":[["der Buchstabe","字母","名词"],["der Name","姓名；名字","名词"],["buchstabieren","拼读；拼写","动词"],["Wie bitte?","请再说一遍？","固定表达"],["wiederholen","重复","动词"],["bitte","请；不客气","副词/礼貌用语"]],"examples":[["Wie schreibt man deinen Namen?","你的名字怎么拼？"],["Ich buchstabiere meinen Namen.","我拼读我的名字。"],["Können Sie das bitte wiederholen?","您能再重复一遍吗？"]],"oral":"请用德语说出自己的名字，再逐个拼读。然后练习询问对方姓名如何拼写。","writing":"写下自己的姓名，并用德语写一句：Ich heiße … 。再写一句：Man schreibt das …（拼作……）。","teaching":"这一课不要求你背完整个字母表。先理解：字母是写出来的符号，字母名称是我们拼读时说出的名字，单词发音则是字母在词语里的实际声音。拼写姓名时，德国人常说：Wie schreibt man das?（这个怎么拼？）你可以逐个说出字母名称。德语字母名称与英语字母名称不同，尤其要注意 J、W、V、Z。","grammar_detail":"拼读姓名时不需要先学复杂语法。先记住两个整句：Wie schreibt man das?（这个怎么拼写？）和 Können Sie das bitte wiederholen?（您能再重复一遍吗？）。Sie 是礼貌称呼“您”，与熟人说话时可使用 du。","pronunciation_note":"字母名称是拼读时说出的名称，不等于字母在单词中的读音。先慢速听，再模仿；J、W、V、Z 特别容易与英语混淆。","dialogue":[["A: Wie heißt du?","你叫什么名字？"],["B: Ich heiße Lin.","我叫 Lin。"],["A: Wie schreibt man das?","这个怎么拼？"],["B: L-I-N.","L-I-N。"]],"vocab_ipa":["/dɛɾ bˈʊxstɑːbə/","/dɛɾ nˈɑːmə/","/bˌʊxstabˈiːrən/","/viː bˈɪtə/","/viːdɜhˈoːlən/","/bˈɪtə/"],"examples_ipa":["/viː ʃrˈa‍ɪpt man dˌa‍ɪnən nˈɑːmən/","/ɪç bˌʊxstabˈiːrə mˌa‍ɪnən nˈɑːmən/","/kˌœnən ziː das bˈɪtə viːdɜhˈoːlən/"],"dialogue_ipa":["/ˈɑː\n viː hˈa‍ɪst duː/","/bˈeː\n ɪç hˈa‍ɪsə lˈiːn/","/ˈɑː\n viː ʃrˈa‍ɪpt man das/","/bˈeː\n ˈɛlˈiːˈɛn/"]},{"id":2,"level":"A1","day":2,"title":"问候、告别与礼貌用语","goal":"在初次见面、离开和请求帮助时使用最基本的礼貌表达。","grammar":"正式与非正式称呼；简单问答","vocab":[["hallo","你好","感叹词"],["Guten Morgen","早上好","固定表达"],["Guten Tag","您好；日安","固定表达"],["Auf Wiedersehen","再见（正式）","固定表达"],["Danke","谢谢","固定表达"],["Entschuldigung","不好意思；对不起","名词/固定表达"]],"examples":[["Guten Morgen! Wie geht es Ihnen?","早上好！您好吗？"],["Danke, gut. Und Ihnen?","谢谢，我很好。您呢？"],["Auf Wiedersehen und einen schönen Tag!","再见，祝您今天愉快！"]],"oral":"分别用 Hallo 和 Guten Tag 开始两段简短对话，并用合适的方式告别。","writing":"写一段四句问候对话，至少使用 Guten Tag、Danke 和 Auf Wiedersehen。","teaching":"德语问候会随时间和场合变化。Hallo 可以用于日常见面；Guten Morgen 常用于早上；Guten Tag 较正式；Auf Wiedersehen 用于较正式的告别。Danke 表示感谢，Bitte 可以表示“请”“给你”或回应感谢时的“不客气”。先把这些整句当作语言积木使用。","grammar_detail":"du 是对朋友、同龄熟人等使用的“你”；Sie 是礼貌场合的“您”，动词形式也会随之变化。刚到德国时，不确定关系是否熟悉，可以先使用 Sie。","pronunciation_note":"Guten 中的 e 常弱读；Wiedersehen 的 w 发 /v/。不要把德语 w 读成英语 w。","dialogue":[["A: Guten Tag!","您好！"],["B: Guten Tag! Wie geht es Ihnen?","您好！您好吗？"],["A: Danke, gut. Und Ihnen?","谢谢，我很好。您呢？"],["B: Auch gut, danke.","我也很好，谢谢。"]],"vocab_ipa":["/hˈaloː/","/ɡˈuːtən mˈɔɾɡən/","/ɡˈuːtən tˈɑːk/","/a‍ʊf viːdɜzˈeːən/","/dˈaŋkə/","/ɛntʃˈʊldɪɡˌʊŋ/"],"examples_ipa":["/ɡˈuːtən mˈɔɾɡən\n viː ɡˈeːt ɛs ˈiːnən/","/dˈaŋkə\n ɡˈuːt\n ʊnt ˈiːnən/","/a‍ʊf viːdɜzˈeːən ʊnt ˌa‍ɪnən ʃˈøːnən tˈɑːk/"],"dialogue_ipa":["/ˈɑː\n ɡˈuːtən tˈɑːk/","/bˈeː\n ɡˈuːtən tˈɑːk\n viː ɡˈeːt ɛs ˈiːnən/","/ˈɑː\n dˈaŋkə\n ɡˈuːt\n ʊnt ˈiːnən/","/bˈeː\n ˌa‍ʊx ɡˈuːt\n dˈaŋkə/"]},{"id":3,"level":"A1","day":3,"title":"自我介绍：姓名、来自哪里与居住地","goal":"用三到四个简单句介绍姓名、来自哪里和目前住在哪里。","grammar":"ich 与动词现在时；陈述句基本语序","vocab":[["heißen","叫作；名叫","动词"],["kommen","来；来自","动词"],["wohnen","居住","动词"],["aus","来自；从","介词"],["in","在……里面；在某地","介词"],["China","中国","专有名词"],["Deutschland","德国","专有名词"]],"examples":[["Ich heiße Lin.","我叫 Lin。"],["Ich komme aus China.","我来自中国。"],["Ich wohne in Deutschland.","我住在德国。"]],"oral":"不看中文，连续说出姓名、来自哪里、住在哪里三句话。","writing":"写一个三句自我介绍。可以使用真实信息，也可以先使用虚构名字练习。","teaching":"德语最基本的陈述句通常把变位后的动词放在第二个位置。比如 Ich wohne in Berlin.（我住在柏林。）主语 ich 在第一位，动词 wohne 在第二位。先整体记住句型：Ich heiße …；Ich komme aus …；Ich wohne in …。","grammar_detail":"动词是表示动作或状态的词。德语动词在句子中会根据“谁做这件事”改变词尾。heißen 的 ich 形式是 heiße；kommen 的 ich 形式是 komme；wohnen 的 ich 形式是 wohne。现在先掌握 ich，不需要一次背完所有人称变化。","pronunciation_note":"heiße 中的 ß 发 /s/；wohne 中 h 不单独发音，而是提示前面的 o 读长音。","dialogue":[["A: Wie heißt du?","你叫什么名字？"],["B: Ich heiße Lin. Und du?","我叫 Lin。你呢？"],["A: Ich heiße Anna. Woher kommst du?","我叫 Anna。你来自哪里？"],["B: Ich komme aus China.","我来自中国。"]],"vocab_ipa":["/hˈa‍ɪsən/","/kˈɔmən/","/vˈoːnən/","/ˈa‍ʊs/","/ˈɪn/","/çˈiːnɑː/","/dˈɔ‍øtʃlant/"],"examples_ipa":["/ɪç hˈa‍ɪsə lˈiːn/","/ɪç kˈɔmə ˌa‍ʊs çˈiːnɑː/","/ɪç vˈoːnə ɪn dˈɔ‍øtʃlant/"],"dialogue_ipa":["/ˈɑː\n viː hˈa‍ɪst duː/","/bˈeː\n ɪç hˈa‍ɪsə lˈiːn\n ˈʊnt duː/","/ˈɑː\n ɪç hˈa‍ɪsə ˈanɑː\n voːhˈeːɾ kˈɔmst duː/","/bˈeː\n ɪç kˈɔmə ˌa‍ʊs çˈiːnɑː/"]},{"id":4,"level":"A1","day":4,"title":"人称代词与 sein（是）","goal":"认识 ich、du、er、sie、wir，并用 sein 介绍身份和状态。","grammar":"人称代词；sein 的现在时","vocab":[["ich","我","人称代词"],["du","你","人称代词"],["er","他","人称代词"],["sie","她；他们/她们；您","人称代词"],["wir","我们","人称代词"],["sein","是","动词"],["müde","疲倦的","形容词"]],"examples":[["Ich bin Lin.","我是 Lin。"],["Du bist sehr freundlich.","你很友好。"],["Wir sind heute müde.","我们今天很累。"]],"oral":"分别用 ich bin、du bist、wir sind 造句。","writing":"写三句：介绍自己、介绍一位朋友、介绍你和朋友。","teaching":"人称代词就是代替人名或人物的词，例如“我、你、他、她、我们”。sein 是德语中非常重要的动词，相当于“是”。它是不规则动词，也就是词形变化不能完全照普通规则推算。先掌握最常用的几种：ich bin（我是）、du bist（你是）、er/sie ist（他/她是）、wir sind（我们是）。","grammar_detail":"比较：Ich bin Lin.（我是 Lin。）Du bist Anna.（你是 Anna。）主语变化，sein 的形式也变化。德语句子中不能把所有人都统一说成 bin。","pronunciation_note":"bin 的元音是短音 /ɪ/；bist 结尾的 st 要清楚发出；sind 的 d 在词尾听感可能较轻，但拼写仍保留 d。","dialogue":[["A: Bist du neu hier?","你是新来这里的吗？"],["B: Ja, ich bin neu hier.","是的，我刚来这里。"],["A: Ich bin Anna.","我是 Anna。"],["B: Schön, dich kennenzulernen.","很高兴认识你。"]],"vocab_ipa":["/ˈɪç/","/dˈuː/","/ˈɛɾ/","/zˈiː/","/vˈiːɾ/","/zˈa‍ɪn/","/mˈyːdə/"],"examples_ipa":["/ɪç bɪn lˈiːn/","/duː bɪst zˈeːɾ frˈɔ‍øntlɪç/","/viːɾ zɪnt hˈɔ‍øtə mˈyːdə/"],"dialogue_ipa":["/ˈɑː\n bɪst duː nˈɔ‍ø hˈiːɾ/","/bˈeː\n jˈɑː\n ɪç bɪn nˈɔ‍ø hˈiːɾ/","/ˈɑː\n ɪç bɪn ˈanɑː/","/bˈeː\n ʃˈøːn\n dɪç kˈɛnənt‍sˌuːlɜnən/"]},{"id":5,"level":"A1","day":5,"title":"国家、语言与来自哪里","goal":"询问并回答来自哪个国家、会说什么语言。","grammar":"Woher-Frage；aus 的基本用法","vocab":[["das Land","国家","名词"],["die Sprache","语言","名词"],["China","中国","专有名词"],["Deutschland","德国","专有名词"],["Chinesisch","中文","语言名称"],["Deutsch","德语","语言名称"],["sprechen","说；讲","动词"]],"examples":[["Woher kommst du?","你来自哪里？"],["Ich komme aus China.","我来自中国。"],["Ich spreche Chinesisch und ein bisschen Deutsch.","我说中文，也会一点德语。"]],"oral":"回答三个问题：Woher kommst du? Welche Sprachen sprichst du? Lernst du Deutsch?","writing":"写三句话介绍自己的国家、母语和正在学习的语言。","teaching":"Woher kommst du? 的意思是“你来自哪里？”回答时常用 Ich komme aus …。问语言可以说 Welche Sprachen sprichst du?（你会说哪些语言？）回答 Ich spreche Chinesisch.（我说中文。）语言名称通常作为语言名使用，国家名称与语言名称不要混为一谈。","grammar_detail":"疑问词 Woher 表示“从哪里来”。疑问词放在句首，动词紧跟其后：Woher kommst du? 这是一个常见的疑问句结构。","pronunciation_note":"Deutsch 的 eu 发 /ɔʏ̯/；sprechen 词首 sp 常读 /ʃp/。","dialogue":[["A: Woher kommst du?","你来自哪里？"],["B: Ich komme aus China.","我来自中国。"],["A: Welche Sprachen sprichst du?","你会说哪些语言？"],["B: Ich spreche Chinesisch und Englisch.","我说中文和英语。"]],"vocab_ipa":["/das lˈant/","/diː ʃpɾˈɑːxə/","/çˈiːnɑː/","/dˈɔ‍øtʃlant/","/çiːnˈeːzɪʃ/","/dˈɔ‍øtʃ/","/ʃpɾˈɛçən/"],"examples_ipa":["/voːhˈeːɾ kˈɔmst duː/","/ɪç kˈɔmə ˌa‍ʊs çˈiːnɑː/","/ɪç ʃpɾˈɛçə çiːnˈeːzɪʃ ʊnt a‍ɪn bˈɪsçən dˈɔ‍øtʃ/"],"dialogue_ipa":["/ˈɑː\n voːhˈeːɾ kˈɔmst duː/","/bˈeː\n ɪç kˈɔmə ˌa‍ʊs çˈiːnɑː/","/ˈɑː\n vˈɛlçə ʃpɾˈɑːxən ʃpɾˈɪkst duː/","/bˈeː\n ɪç ʃpɾˈɛçə çiːnˈeːzɪʃ ʊnt ˈɛŋlɪʃ/"]},{"id":6,"level":"A1","day":6,"title":"数字、年龄与电话号码","goal":"说出常见数字，询问年龄并慢速报出电话号码。","grammar":"数字表达；Wie alt bist du?","vocab":[["null","零","数词"],["eins","一","数词"],["zwei","二","数词"],["zehn","十","数词"],["zwanzig","二十","数词"],["das Alter","年龄","名词"],["die Telefonnummer","电话号码","名词"]],"examples":[["Wie alt bist du?","你多大？"],["Ich bin 28 Jahre alt.","我28岁。"],["Meine Telefonnummer ist 0176 … .","我的电话号码是 0176……。"]],"oral":"读出 0–20，并用德语说出自己的年龄。电话号码可使用虚构号码练习。","writing":"写下三个数字、一个年龄句和一个请求对方重复电话号码的句子。","teaching":"数字在德国生活中非常实用：电话号码、门牌号、价格和预约时间都会用到。报电话号码时通常一位一位或按清晰的小组读出；听不清时可以礼貌地请求对方重复。年龄表达使用 sein：Ich bin 25 Jahre alt.（我25岁。）德语不说“我有25岁”。","grammar_detail":"Wie alt bist du? 字面是“你多大？”。回答用 Ich bin … Jahre alt.。这里的 Jahre 是 Jahr（年）的复数形式。数字先练 0–20，再逐步扩展到整十和复合数字。","pronunciation_note":"注意 sechs /zɛks/、sieben /ˈziːbn̩/、zwölf /t͡svœlf/ 的辅音和元音；数字报读时不要吞掉词尾。","dialogue":[["A: Wie ist deine Telefonnummer?","你的电话号码是多少？"],["B: 0176 …","0176……"],["A: Können Sie die Nummer bitte wiederholen?","您能再重复一下号码吗？"],["B: Ja, natürlich.","好的，当然可以。"]],"vocab_ipa":["/nˈʊl/","/ˈa‍ɪns/","/t‍svˈa‍ɪ/","/t‍sˈeːn/","/t‍svˈant‍sɪç/","/das ˈaltɜ/","/diː tˌeːleːfˈɔnʊmɜ/"],"examples_ipa":["/viː ˈalt bɪst duː/","/ɪç bɪn ˈaxt ʊntt‍svˈant‍sɪç jˈɑːrə ˈalt/","/mˌa‍ɪnə tˌeːleːfˈɔnʊmɜ ɪst nˈʊlˈa‍ɪnszˈiːbənzˈɛks/"],"dialogue_ipa":["/ˈɑː\n viː ɪst dˌa‍ɪnə tˌeːleːfˈɔnʊmɜ/","/bˈeː\n nˈʊlˈa‍ɪnszˈiːbənzˈɛks/","/ˈɑː\n kˌœnən ziː diː nˈʊmɜ bˈɪtə viːdɜhˈoːlən/","/bˈeː\n jˈɑː\n nɑːtˈyːɾlɪç/"]},{"id":7,"level":"A1","day":7,"title":"家庭与简单人物介绍","goal":"介绍家庭成员，并用简单句描述人物关系。","grammar":"名词冠词 der、die、das；mein/meine 初步认识","vocab":[["die Familie","家庭","名词"],["der Vater","父亲","名词"],["die Mutter","母亲","名词"],["der Bruder","兄弟","名词"],["die Schwester","姐妹","名词"],["das Kind","孩子","名词"],["mein/meine","我的","物主词"]],"examples":[["Das ist meine Familie.","这是我的家庭。"],["Mein Bruder wohnt in China.","我兄弟住在中国。"],["Meine Schwester spricht Deutsch.","我姐妹会说德语。"]],"oral":"用三句话介绍家庭成员，可以选择真实情况或虚构人物。","writing":"写三句介绍家人，至少使用 mein 或 meine。","teaching":"德语名词通常有语法性别，常见冠词有 der、die、das。它们在这里相当于帮助我们识别名词类别的“小标签”，不完全等同于现实中的男女。学习名词时，建议把冠词和名词一起记：der Vater、die Mutter、das Kind。mein 表示“我的”，会根据后面的名词形式发生变化；本课先认识 mein Bruder 和 meine Mutter 两个常见组合。","grammar_detail":"名词是人、地点、物品或概念的名称。德语名词首字母通常大写。der、die、das 是定冠词；mein、meine 是物主词，表示所属关系。先整体记忆词组，不必在本课掌握所有变格规则。","pronunciation_note":"Vater 的 v 常读 /f/；Mutter 的 u 是短音；Bruder 中的 r 在标准德语里常弱化。","dialogue":[["A: Hast du Geschwister?","你有兄弟姐妹吗？"],["B: Ja, ich habe einen Bruder.","有，我有一个兄弟。"],["A: Wo wohnt er?","他住在哪里？"],["B: Er wohnt in China.","他住在中国。"]],"vocab_ipa":["/diː famˈiːlɪə/","/dɛɾ fˈɑːtɜ/","/diː mˈʊtɜ/","/dɛɾ bɾˈuːdɜ/","/diː ʃvˈɛstɜ/","/das kˈɪnt/","/ma‍ɪn mˈa‍ɪnə/"],"examples_ipa":["/das ɪst mˌa‍ɪnə famˈiːlɪə/","/ma‍ɪn bɾˈuːdɜ vˈoːnt ɪn çˈiːnɑː/","/mˌa‍ɪnə ʃvˈɛstɜ ʃpɾˈɪçt dˈɔ‍øtʃ/"],"dialogue_ipa":["/ˈɑː\n hast duː ɡəʃvˈɪstɜ/","/bˈeː\n jˈɑː\n ɪç hɑːbə ˌa‍ɪnən bɾˈuːdɜ/","/ˈɑː\n vˌoː vˈoːnt ɛɾ/","/bˈeː\n ɛɾ vˈoːnt ɪn çˈiːnɑː/"]},{"id":8,"level":"A1","day":8,"title":"职业与工作","goal":"说出常见职业，简单介绍自己做什么工作。","grammar":"职业名词；arbeiten 的现在时 ich/du/er-sie","vocab":[["der Beruf","职业","名词"],["arbeiten","工作","动词"],["der Lehrer","男教师","名词"],["die Lehrerin","女教师","名词"],["der Arzt","男医生","名词"],["die Ärztin","女医生","名词"],["das Büro","办公室","名词"]],"examples":[["Was bist du von Beruf?","你从事什么职业？"],["Ich arbeite als Lehrer.","我是一名教师。"],["Ich arbeite in einem Büro.","我在办公室工作。"]],"oral":"介绍自己的职业或目前的学习状态；如果暂时没有工作，可以说 Ich lerne Deutsch.。","writing":"写三句介绍职业、工作地点和是否喜欢这份工作。","teaching":"询问职业可以说 Was bist du von Beruf?（你从事什么职业？）更自然的另一种说法是 Was machst du beruflich? 回答可以说 Ich bin … von Beruf. 或 Ich arbeite als …。职业名称有时会因性别或构词方式变化，先学习常见形式，不必一次记住全部规则。","grammar_detail":"arbeiten 是“工作”。ich arbeite（我工作），du arbeitest（你工作），er/sie arbeitet（他/她工作）。德语动词词尾随主语变化。als 在 Ich arbeite als … 中表示“作为……职业”。","pronunciation_note":"arbeiten 的 r 和词尾 -en 需要慢速练习；Beruf 的重音在第二音节：Be-RUF。","dialogue":[["A: Was machst du beruflich?","你从事什么工作？"],["B: Ich arbeite in einem Büro.","我在办公室工作。"],["A: Arbeitest du gern dort?","你喜欢在那里工作吗？"],["B: Ja, meistens.","是的，大多数时候喜欢。"]],"vocab_ipa":["/dɛɾ bərˈuːf/","/ˈaɾba‍ɪtən/","/dɛɾ lˈeːrɜ/","/diː lˈeːrərˌɪn/","/dɛɾ ˈaɾt‍st/","/diː ˈɛɾt‍stɪn/","/das bˈyːroː/"],"examples_ipa":["/vˈas bɪst duː fɔn bərˈuːf/","/ɪç ˈaɾba‍ɪtə als lˈeːrɜ/","/ɪç ˈaɾba‍ɪtə ɪn ˌa‍ɪnəm bˈyːroː/"],"dialogue_ipa":["/ˈɑː\n vˈas mˈaxst duː bərˈuːflɪç/","/bˈeː\n ɪç ˈaɾba‍ɪtə ɪn ˌa‍ɪnəm bˈyːroː/","/ˈɑː\n ˈaɾba‍ɪtəst duː ɡˈɛɾn dˈɔɾt/","/bˈeː\n jˈɑː\n mˈa‍ɪstəns/"]},{"id":9,"level":"A1","day":9,"title":"星期、日期与约时间","goal":"说出星期几，理解简单日期，并提出见面时间。","grammar":"am + 星期；um + 钟点","vocab":[["der Montag","星期一","名词"],["der Dienstag","星期二","名词"],["der Mittwoch","星期三","名词"],["der Freitag","星期五","名词"],["die Uhr","钟；点钟","名词"],["heute","今天","副词"],["morgen","明天；早晨","副词/名词"]],"examples":[["Heute ist Montag.","今天是星期一。"],["Wir treffen uns am Freitag.","我们星期五见面。"],["Passt dir um zehn Uhr?","十点对你合适吗？"]],"oral":"说出今天是星期几，并提出一个星期和钟点组成的见面时间。","writing":"写一条简短消息，邀请朋友星期五十点见面。","teaching":"约时间时，am 常用于星期或某一天：am Montag（星期一）；um 用于具体钟点：um zehn Uhr（十点）。两者不要混淆。询问时间可以说 Wann hast du Zeit?（你什么时候有空？）","grammar_detail":"介词是放在名词或名词词组前、表示时间地点等关系的词。这里先把 am Montag 和 um 10 Uhr 当作固定搭配记忆。","pronunciation_note":"Montag 的重音在第一音节；zwanzig 中的 z 发 /t͡s/。","dialogue":[["A: Wann hast du Zeit?","你什么时候有空？"],["B: Am Freitag.","星期五。"],["A: Um wie viel Uhr?","几点？"],["B: Um zehn Uhr.","十点。"]],"vocab_ipa":["/dɛɾ mˈoːntɑːk/","/dɛɾ dˈiːnstɑːk/","/dɛɾ mˈɪtvɔx/","/dɛɾ frˈa‍ɪtɑːk/","/diː ˈuːɾ/","/hˈɔ‍øtə/","/mˈɔɾɡən/"],"examples_ipa":["/hˈɔ‍øtə ɪst mˈoːntɑːk/","/viːɾ tɾˈɛfən ʊns am frˈa‍ɪtɑːk/","/pˈast diːɾ ʊm t‍sˈeːn ˈuːɾ/"],"dialogue_ipa":["/ˈɑː\n vˈan hast duː t‍sˈa‍ɪt/","/bˈeː\n am frˈa‍ɪtɑːk/","/ˈɑː\n ʊm viː fˈiːl ˈuːɾ/","/bˈeː\n ʊm t‍sˈeːn ˈuːɾ/"]},{"id":10,"level":"A1","day":10,"title":"日常作息与简单现在时","goal":"描述早上、白天和晚上的基本活动。","grammar":"规则动词现在时；时间词放在句首","vocab":[["lernen","学习","动词"],["arbeiten","工作","动词"],["spielen","玩；打（球）","动词"],["der Morgen","早晨","名词"],["der Abend","晚上","名词"],["am Morgen","在早上","时间表达"],["am Abend","在晚上","时间表达"]],"examples":[["Ich lerne am Morgen Deutsch.","我早上学习德语。"],["Am Nachmittag arbeite ich.","下午我工作。"],["Am Abend spiele ich Tennis.","晚上我打网球。"]],"oral":"用 morgens/abends 或 am Morgen/am Abend 描述自己的一天。","writing":"写四句日常作息，至少有一句把时间表达放在句首。","teaching":"描述日常生活时，可以使用 lernen（学习）、arbeiten（工作）、spielen（玩/打球）等动词。动词形式要和主语匹配。时间词也可以放在句首：Am Morgen lerne ich Deutsch.（早上我学德语。）当时间词放在句首时，动词仍然在第二个位置，所以 ich 会移到动词后面。","grammar_detail":"德语陈述句的动词通常占第二个句子成分位置。Ich lerne am Morgen Deutsch. 与 Am Morgen lerne ich Deutsch. 都正确。注意第二句不是 Am Morgen ich lerne…","pronunciation_note":"Morgen 中的 g 在标准发音中保持清晰；lernen 的词尾 -en 常弱读，但不要完全省略。","dialogue":[["A: Was machst du am Abend?","你晚上做什么？"],["B: Ich spiele Tennis.","我打网球。"],["A: Spielst du oft?","你经常打球吗？"],["B: Ja, zweimal pro Woche.","是的，每周两次。"]],"vocab_ipa":["/lˈɛɾnən/","/ˈaɾba‍ɪtən/","/ʃpˈiːlən/","/dɛɾ mˈɔɾɡən/","/dɛɾ ˈɑːbənt/","/am mˈɔɾɡən/","/am ˈɑːbənt/"],"examples_ipa":["/ɪç lˈɛɾnə am mˈɔɾɡən dˈɔ‍øtʃ/","/am nˈaxmɪtˌɑːk ˈaɾba‍ɪtə ɪç/","/am ˈɑːbənt ʃpˈiːlə ɪç tˈɛnɪs/"],"dialogue_ipa":["/ˈɑː\n vˈas mˈaxst duː am ˈɑːbənt/","/bˈeː\n ɪç ʃpˈiːlə tˈɛnɪs/","/ˈɑː\n ʃpˈiːlst duː ˈɔft/","/bˈeː\n jˈɑː\n t‍svˈa‍ɪmɑːl pɾˌoː vˈɔxə/"]},{"id":11,"level":"A1","day":11,"title":"饮食、饮料与礼貌点餐","goal":"在咖啡馆或餐厅点一杯饮料和一份简单食物。","grammar":"möchten 的礼貌请求；bitte 的用法","vocab":[["der Kaffee","咖啡","名词"],["der Tee","茶","名词"],["das Wasser","水","名词"],["das Brot","面包","名词"],["der Apfel","苹果","名词"],["möchten","想要（礼貌表达）","动词"],["die Rechnung","账单","名词"]],"examples":[["Ich möchte einen Kaffee, bitte.","请给我一杯咖啡。"],["Ein Wasser, bitte.","请给我一杯水。"],["Die Rechnung, bitte.","请给我账单。"]],"oral":"角色扮演：你是顾客，点一杯饮料和一份食物。","writing":"写一段三到四句的点餐对话，并使用 bitte 和 danke。","teaching":"在德国点餐时，Ich möchte …, bitte. 是礼貌而实用的表达，意思是“我想要……”。möchten 表示礼貌愿望，初学时可以把 Ich möchte … 作为固定句型。服务人员可能问 Sonst noch etwas?（还需要别的吗？）你可以回答 Nein, danke. 或 Ja, bitte.。","grammar_detail":"möchten 是礼貌表达“想要”的动词形式。它与 mögen 有历史关系，但本课先把 Ich möchte + 物品 当作完整句型使用。请注意 bitte 可以放在请求句末，表示礼貌。","pronunciation_note":"möchte 中 ö 是圆唇元音；Kaffee 的双 f 让前面的 a 保持短音，ee 表示长音。","dialogue":[["A: Guten Tag. Was möchten Sie?","您好。您想要什么？"],["B: Ich möchte einen Tee und ein Brot, bitte.","我想要一杯茶和一份面包。"],["A: Sonst noch etwas?","还需要别的吗？"],["B: Nein, danke.","不用了，谢谢。"]],"vocab_ipa":["/dɛɾ kˈafeː/","/dɛɾ tˈeː/","/das vˈasɜ/","/das bɾˈoːt/","/dɛɾ ˈapfəl/","/mˈœçtən/","/diː rˈɛçnʊŋ/"],"examples_ipa":["/ɪç mˈœçtə ˌa‍ɪnən kˈafeː\n bˈɪtə/","/a‍ɪn vˈasɜ\n bˈɪtə/","/diː rˈɛçnʊŋ\n bˈɪtə/"],"dialogue_ipa":["/ˈɑː\n ɡˈuːtən tˈɑːk\n vˈas mˈœçtən ziː/","/bˈeː\n ɪç mˈœçtə ˌa‍ɪnən tˈeː ʊnt a‍ɪn bɾˈoːt\n bˈɪtə/","/ˈɑː\n zˈɔnst nˈɔx ˈɛtvɑːs/","/bˈeː\n nˈa‍ɪn\n dˈaŋkə/"]},{"id":12,"level":"A1","day":12,"title":"超市购物与第四格的初步理解","goal":"在超市询问商品、表达想买什么，并初步理解句子中“被购买的东西”。","grammar":"Akkusativ（第四格）的入门：直接承受动作的对象","vocab":[["der Apfel","苹果","名词"],["die Banane","香蕉","名词"],["das Brot","面包","名词"],["kaufen","购买","动词"],["suchen","寻找","动词"],["kosten","花费；价格为","动词"],["der Preis","价格","名词"]],"examples":[["Ich kaufe einen Apfel.","我买一个苹果。"],["Ich möchte das Brot kaufen.","我想买这个面包。"],["Wie viel kostet eine Banane?","一根香蕉多少钱？"]],"oral":"说出你想买的三样东西，至少使用一次 Ich kaufe …。","writing":"写三句购物句子：买一个苹果、买面包、询问香蕉价格。","teaching":"先不用害怕“Akkusativ（第四格）”这个术语。想象句子：Ich kaufe einen Apfel.（我买一个苹果。）谁买？ich（我）。买什么？einen Apfel（一个苹果）。这里“被买的苹果”就是动作直接作用的对象。德语会用词形变化标记这种关系。初学阶段先观察：阳性 der Apfel 在这里变成 einen Apfel；阴性 die Banane 和中性 das Brot 在这个简单例子里形式不变。","grammar_detail":"Akkusativ 常被称为第四格。它回答“谁/什么被动作直接影响？”这类问题。先对比：Der Apfel ist rot.（这个苹果是红的。）Ich kaufe einen Apfel.（我买一个苹果。）在第二句里，阳性不定冠词 ein 变为 einen。现在只掌握这个最常见变化，不要同时背所有格变化表。","pronunciation_note":"kaufe 的 au 读 /aʊ̯/；Apfel 的重音在第一音节；einen 的 ei 读 /aɪ̯/。","dialogue":[["A: Guten Tag. Kann ich Ihnen helfen?","您好。我能帮您吗？"],["B: Ja, ich suche Äpfel.","是的，我在找苹果。"],["A: Hier sind die Äpfel.","苹果在这里。"],["B: Danke. Ich kaufe einen Apfel.","谢谢。我买一个苹果。"]],"vocab_ipa":["/dɛɾ ˈapfəl/","/diː banˈɑːnə/","/das bɾˈoːt/","/kˈa‍ʊfən/","/zˈuːxən/","/kˈɔstən/","/dɛɾ pɾˈa‍ɪs/"],"examples_ipa":["/ɪç kˈa‍ʊfə ˌa‍ɪnən ˈapfəl/","/ɪç mˈœçtə das bɾˈoːt kˈa‍ʊfən/","/viː fˈiːl kˈɔstət ˌa‍ɪnə banˈɑːnə/"],"dialogue_ipa":["/ˈɑː\n ɡˈuːtən tˈɑːk\n kˌan ɪç ˌiːnən hˈɛlfən/","/bˈeː\n jˈɑː\n ɪç zˈuːxə ˈɛpfəl/","/ˈɑː\n hˈiːɾ zɪnt diː ˈɛpfəl/","/bˈeː\n dˈaŋkə\n ɪç kˈa‍ʊfə ˌa‍ɪnən ˈapfəl/"]},{"id":13,"level":"A1","day":13,"title":"时间日期","goal":"掌握「时间日期」相关表达，并能在生活、学习或工作场景中使用。","grammar":"星期、月份、钟点；am/um/im","vocab":[["der Vater","父亲","名词"],["die Mutter","母亲","名词"],["der Beruf","职业","名词"],["arbeiten","工作","动词"],["der Tag","日子","名词"]],"examples":[["Ich komme aus China.","我来自中国。"],["Ich lerne jeden Tag Deutsch.","我每天学习德语。"],["Wo wohnst du?","你住在哪里？"]],"oral":"围绕「时间日期」进行 1–2 分钟口头表达，至少使用本课 3 个词汇和 2 个目标结构。","writing":"围绕「时间日期」写一段 40–60 词德语短文，检查语序、词尾和拼写。","vocab_ipa":["/dɛɾ fˈɑːtɜ/","/diː mˈʊtɜ/","/dɛɾ bərˈuːf/","/ˈaɾba‍ɪtən/","/dɛɾ tˈɑːk/"],"examples_ipa":["/ɪç kˈɔmə ˌa‍ʊs çˈiːnɑː/","/ɪç lˈɛɾnə jˈeːdən tˈɑːk dˈɔ‍øtʃ/","/vˌoː vˈoːnst duː/"]},{"id":14,"level":"A1","day":14,"title":"饮食点餐","goal":"掌握「饮食点餐」相关表达，并能在生活、学习或工作场景中使用。","gr 常生活","goal":"描述起床、洗漱、学习、工作和休息等日常活动。","grammar":"规则动词现在时；可分动词；反身表达初识","vocab":[["aufstehen","起床","可分动词"],["aufwachen","醒来","可分动词"],["duschen","淋浴","动词"],["sich waschen","洗漱；洗自己","反身表达"],["sich anziehen","穿衣服","反身表达/可分动词"],["frühstücken","吃早餐","动词"],["arbeiten","工作","动词"],["lernen","学习","动词"],["einkaufen","购物","可分动词"],["kochen","做饭","动词"],["aufräumen","整理","可分动词"],["fernsehen","看电视","可分动词"],["schlafen","睡觉","不规则动词"]],"vocab_ipa":["/ˈaʊ̯fˌʃteːən/","/ˈaʊ̯fˌvaxn̩/","/ˈdʊʃn̩/","/zɪç ˈvaʃn̩/","/zɪç ˈantsiːən/","/ˈfʁyːʃtʏkn̩/","/ˈaʁbaɪ̯tn̩/","/ˈlɛʁnən/","/ˈaɪ̯nˌkaʊ̯fn̩/","/ˈkɔxn̩/","/ˈaʊ̯fˌʁɔʏ̯mən/","/ˈfɛʁnˌzeːən/","/ˈʃlaːfn̩/"],"examples":[["Ich stehe um sieben Uhr auf.","我七点起床。"],["Danach dusche ich.","之后我洗澡。"],["Am Abend lerne ich Deutsch.","晚上我学习德语。"],["Ich gehe um elf Uhr schlafen.","我十一点睡觉。"]],"examples_ipa":["/ɪç ˈʃteːə ʊm ˈziːbn̩ uːɐ̯ aʊ̯f/","/daˈnaːx ˈdʊʃə ɪç/","/am ˈaːbn̩t ˈlɛʁnə ɪç dɔʏ̯tʃ/","/ɪç ˈɡeːə ʊm ɛlf uːɐ̯ ˈʃlaːfn̩/"],"dialogue":[["Wann stehst du auf?","你几点起床？"],["Ich stehe um sieben Uhr auf.","我七点起床。"],["Was machst du am Abend?","你晚上做什么？"],["Ich lerne Deutsch und gehe dann schlafen.","我学习德语，然后睡觉。"]],"dialogue_ipa":["/van ʃteːst duː aʊ̯f/","/ɪç ˈʃteːə ʊm ˈziːbn̩ uːɐ̯ aʊ̯f/","/vas maxst duː am ˈaːbn̩t/","/ɪç ˈlɛʁnə dɔʏ̯tʃ ʊnt ˈɡeːə dan ˈʃlaːfn̩/"],"teaching":"描述每天做什么时，常用现在时。可分动词由前缀和动词主体组成，例如 aufstehen。主句中，变位动词在第二位，前缀移到句尾：Ich stehe früh auf.。如果前面有 möchte 等情态动词，动词原形留在句尾：Ich möchte früh aufstehen。","grammar_detail":"反身表达表示动作回到动作执行者自己身上。比如 sich waschen 是“洗自己/洗漱”。ich 对应 mich：Ich wasche mich.；du 对应 dich：Du wäschst dich.。可分动词在普通主句中拆开；在 möchten + 动词原形结构中不拆开。","pronunciation_note":"aufstehen 的重音在前缀 auf；waschen 的 du 形式是 wäschst，注意 ä 的发音。句子朗读时，句尾可分前缀要清楚，不要漏读。","oral":"按时间顺序说出自己一天中的五项活动。","writing":"写一段五句短文，描述从起床到睡觉的一天。"},{"id":12,"level":"A1","day":12,"title":"Essen und Trinken：食物、饮料与餐厅点餐","goal":"说出常见食物饮料，在餐厅礼貌点餐。","grammar":"möchten；第四格入门；nehmen 的不规则变化；kein/nicht 初识","vocab":[["das Brot","面包","名词·中性·复数：die Brote"],["das Brötchen","小面包","名词·中性·复数：die Brötchen"],["der Reis","米饭；米","名词·阳性"],["die Kartoffel","土豆","名词·阴性·复数：die Kartoffeln"],["die Nudel","面条","名词·阴性·复数：die Nudeln"],["die Pizza","披萨","名词·阴性·复数：die Pizzen"],["die Suppe","汤","名词·阴性·复数：die Suppen"],["der Salat","沙拉","名词·阳性·复数：die Salate"],["das Fleisch","肉","名词·中性"],["der Fisch","鱼","名词·阳性·复数：die Fische"],["das Ei","鸡蛋","名词·中性·复数：die Eier"],["der Käse","奶酪","名词·阳性"],["das Wasser","水","名词·中性"],["der Kaffee","咖啡","名词·阳性"],["der Tee","茶","名词·阳性"],["die Milch","牛奶","名词·阴性"],["der Saft","果汁","名词·阳性"],["die Rechnung","账单","名词·阴性·复数：die Rechnungen"]],"vocab_ipa":["/bʁoːt/","/ˈbʁøːtçən/","/ʁaɪ̯s/","/kaʁˈtɔfl̩/","/ˈnuːdl̩/","/ˈpɪtsa/","/ˈzʊpə/","/zaˈlaːt/","/flaɪ̯ʃ/","/fɪʃ/","/aɪ̯/","/ˈkɛːzə/","/ˈvasɐ/","/kaˈfeː/","/teː/","/mɪlç/","/zaft/","/ˈʁɛçnʊŋ/"],"examples":[["Ich möchte einen Kaffee.","我想要一杯咖啡。"],["Ich möchte eine Suppe essen.","我想喝/吃一份汤。"],["Ich nehme den Salat.","我点这份沙拉。"],["Ich möchte keine Milch.","我不想要牛奶。"]],"examples_ipa":["/ɪç ˈmœçtə ˈaɪ̯nən kaˈfeː/","/ɪç ˈmœçtə ˈaɪ̯nə ˈzʊpə ˈɛsn̩/","/ɪç ˈneːmə deːn zaˈlaːt/","/ɪç ˈmœçtə ˈkaɪ̯nə mɪlç/"],"dialogue":[["Guten Abend! Was möchten Sie bestellen?","晚上好！您想点些什么？"],["Ich möchte eine Suppe und einen Salat, bitte.","我想要一份汤和一份沙拉。"],["Ein stilles Wasser, bitte.","请给我一瓶无气泡水。"],["Die Rechnung, bitte.","请给我账单。"]],"dialogue_ipa":["/ˈɡuːtn̩ ˈaːbn̩t vas ˈmœçtn̩ ziː bəˈʃtɛlən/","/ɪç ˈmœçtə ˈaɪ̯nə ˈzʊpə ʊnt ˈaɪ̯nən zaˈlaːt ˈbɪtə/","/aɪ̯n ˈʃtɪləs ˈvasɐ ˈbɪtə/","/diː ˈʁɛçnʊŋ ˈbɪtə/"],"teaching":"在餐厅表达需求时，möchten 比直接命令更礼貌。Ich möchte … 意思是“我想要……”。它后面可以接名词，也可以接另一个动词原形；当接动词原形时，动词原形通常放在句尾。","grammar_detail":"Akkusativ（第四格）是德语用来标记许多直接承受动作的对象的形式。问“谁做动作、动作作用于什么？”例如 Ich esse einen Apfel.（我吃一个苹果。）Apfel 是被吃的东西。阳性冠词变化明显：der→den，ein→einen；阴性 die/eine 和中性 das/ein 在本例中形式不变。nehmen 的常见变化是 ich nehme、du nimmst、er nimmt。kein 通常否定名词，nicht 常否定动作或形容词。","pronunciation_note":"möchten 中的 ö 是圆唇前元音 [œ]；Milch 末尾 ch 是 [ç]。IPA表示标准发音目标，不等于真人录音。","oral":"模拟点餐：点一份主食、一杯饮料，并礼貌索要账单。","writing":"写一段四轮点餐对话，至少使用 möchten、einen/eine/ein 和 bitte。"},{"id":13,"level":"A1","day":13,"title":"Einkaufen：超市购物与价格","goal":"在超市询问商品、价格、数量，并完成付款。","grammar":"Wie viel kostet…?；haben；brauchen；kein 的变化","vocab":[["der Supermarkt","超市","名词·阳性·复数：die Supermärkte"],["das Geschäft","商店","名词·中性·复数：die Geschäfte"],["der Preis","价格","名词·阳性·复数：die Preise"],["das Geld","钱","名词·中性"],["die Kasse","收银台","名词·阴性·复数：die Kassen"],["der Euro","欧元","名词·阳性·复数：die Euro"],["der Cent","欧分","名词·阳性·复数：die Cent"],["die Karte","卡","名词·阴性·复数：die Karten"],["die Tüte","袋子","名词·阴性·复数：die Tüten"],["die Flasche","瓶子","名词·阴性·复数：die Flaschen"],["kaufen","购买","动词"],["bezahlen","付款","动词"],["brauchen","需要","动词"],["kosten","花费","动词"],["bar","现金地","副词/形容词"]],"vocab_ipa":["/ˈzuːpɐmaʁkt/","/ɡəˈʃɛft/","/pʁaɪ̯s/","/ɡɛlt/","/ˈkasə/","/ˈɔʏ̯ʁo/","/tsɛnt/","/ˈkaʁtə/","/ˈtyːtə/","/ˈflaʃə/","/ˈkaʊ̯fn̩/","/bəˈtsaːlən/","/ˈbʁaʊ̯xn̩/","/ˈkɔstn̩/","/baːɐ̯/"],"examples":[["Wie viel kostet das Brot?","面包多少钱？"],["Das kostet zwei Euro fünfzig.","这个两欧元五十分。"],["Ich brauche eine Flasche Wasser.","我需要一瓶水。"],["Kann ich mit Karte bezahlen?","我可以刷卡吗？"]],"examples_ipa":["/viː fiːl ˈkɔstət das bʁoːt/","/das ˈkɔstət tsvaɪ̯ ˈɔʏ̯ʁoː ˈfʏnftsɪç/","/ɪç ˈbʁaʊ̯xə ˈaɪ̯nə ˈflaʃə ˈvasɐ/","/kan ɪç mɪt ˈkaʁtə bəˈtsaːlən/"],"dialogue":[["Entschuldigung, wo finde ich die Milch?","不好意思，我在哪里可以找到牛奶？"],["Die Milch ist dort links.","牛奶在那边左侧。"],["Wie viel kostet das Brot?","面包多少钱？"],["Ich bezahle mit Karte.","我刷卡付款。"]],"dialogue_ipa":["/ɛntˈʃʊldɪɡʊŋ voː ˈfɪndə ɪç diː mɪlç/","/diː mɪlç ɪst dɔʁt lɪŋks/","/viː fiːl ˈkɔstət das bʁoːt/","/ɪç bəˈtsaːlə mɪt ˈkaʁtə/"],"teaching":"询问价格最常用的句型是 Wie viel kostet …?。德国价格通常用逗号表示小数，例如 2,50 €。1 Euro 等于 100 Cent。","grammar_detail":"kosten 的第三人称单数形式是 kostet：Das Brot kostet zwei Euro.。haben 表示有：ich habe、du hast、er hat。brauchen 表示需要：ich brauche、du brauchst、er braucht。kein 否定名词：keine Tüte（没有/不需要袋子）。","pronunciation_note":"Euro 的 eu 读 [ɔʏ̯]；Karte 的 r 在标准德语口音中常呈现小舌音或弱化。价格朗读时注意 neunundneunzig 中个位在十位前。","oral":"模拟在超市找牛奶、询问面包价格、选择付款方式。","writing":"写一张购物清单，并写出三句询价或付款时会说的话。"}];

const KEY='deutschWeg4data';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{done:{},mistakes:[],reviews:{},notes:{},scores:[],journal:[],start:new Date().toISOString().slice(0,10),current:1,articlesRead:[]}}catch(e){state={done:{},mistakes:[],reviews:{},notes:{},scores:[],journal:[],start:new Date().toISOString().slice(0,10),current:1,articlesRead:[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(state));renderHome()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function L(id=state.current){return lessons[Math.max(1,Math.min(240,+id||1))-1]}function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(id==='home')renderHome();if(id==='phonetics')renderPhonetics();if(id==='course')renderCourse();if(id==='practice')renderPractice();if(id==='life')renderLife();if(id==='profile')renderProfile();if(id==='exam')renderExam()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));function say(t,rate=.86){if(!('speechSynthesis'in window)){alert('此浏览器不支持语音合成。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=rate;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^de([-_]|$)/i.test(v.lang))||null;speechSynthesis.speak(u)}function completed(id){return !!state.done[id]?.passed}const phonetics=[
{title:'第1课：什么是 IPA？',goal:'认识国际音标，知道它记录的是声音，而不是字母名称。',body:`<p>IPA 是“国际音标”的缩写。它用相对统一的符号记录人实际发出的声音。德语拼写和发音有规律，但一个字母在不同单词里可能发出不同声音，因此我们要同时看拼写和音标。</p><div class="explain"><b>先认识三个概念</b><ul><li><b>字母：</b>书写符号，例如 a。</li><li><b>字母名称：</b>你拼读字母表时说出的名称。</li><li><b>音素/语音：</b>单词里实际听到、说出的声音。</li></ul></div><p><b>示例</b>：<span class="word">Mann</span> <span class="ipa">/man/</span> = 男人。这里的音标告诉我们单词的实际读音，不是逐个念字母名称。</p><p>音标通常写在斜线 / / 之间。看到 /a/，就把它当作一个声音提示，而不是英语字母名称。</p>`,words:[['Mann','/man/','男人'],['Name','/ˈnaːmə/','名字'],['ich','/ɪç/','我']]},
{title:'第2课：德语元音入门',goal:'辨认 a、e、i、o、u 五个基本元音的大致发音位置。',body:`<p>元音发音时，气流从口腔通过，通常不会被嘴唇或舌头完全阻断。先慢慢听、看口型，再模仿，不必追求一次完美。</p><p><b>a</b>：嘴巴张开；<b>i</b>：嘴角稍向两侧；<b>u</b>：嘴唇收圆。德语 e、o 的实际音值也要通过听辨建立。</p><div class="notice">中文近似音只能帮助理解，不能替代 IPA，也不建议把德语元音硬套成中文拼音。</div>`,words:[['Name','/ˈnaːmə/','名字'],['bitte','/ˈbɪtə/','请'],['Sonne','/ˈzɔnə/','太阳'],['gut','/ɡuːt/','好']]},
{title:'第3课：长元音与短元音',goal:'初步听出元音长短，理解长短可能区分单词。',body:`<p>德语元音有长短之分。长音通常持续更久，短音更短促；但不能只凭拼写中的一个规则判断所有单词，必须把常见词和音标一起学习。</p><p>比较：<b>Staat</b> <span class="ipa">/ʃtaːt/</span>（国家）与 <b>Stadt</b> <span class="ipa">/ʃtat/</span>（城市）。两词拼写相近，元音长短不同，意思也不同。</p><p>练习时先夸张地区分长短，再逐渐恢复自然语速。</p>`,words:[['Staat','/ʃtaːt/','国家'],['Stadt','/ʃtat/','城市'],['Bett','/bɛt/','床'],['Beet','/beːt/','花坛']]},
{title:'第4课：变元音 ä、ö、ü',goal:'认识三个带变音符号的元音，并练习嘴型。',body:`<p>ä、ö、ü 是德语常见字母。两个小点不是装饰，它们提示元音发音发生变化。</p><ul><li><b>ä</b>：常接近 /ɛ/ 或 /ɛː/，具体看单词。</li><li><b>ö</b>：发音时舌位接近 e，同时嘴唇收圆。</li><li><b>ü</b>：发音时舌位接近 i，同时嘴唇收圆。</li></ul><p>练 ü 时先发 /iː/，保持舌头位置，再把嘴唇慢慢收圆；不要直接读成“乌”。</p>`,words:[['Mädchen','/ˈmɛːtçən/','女孩'],['schön','/ʃøːn/','漂亮的'],['über','/ˈyːbɐ/','关于；在……上方']]},
{title:'第5课：双元音',goal:'学习 ei、ie、eu/äu 的常见读音。',body:`<p>双元音是一个音节中两个元音成分连在一起的声音。特别注意：德语 <b>ei</b> 通常读 /aɪ̯/，而 <b>ie</b> 通常读长音 /iː/，不要把它们弄反。</p><p><b>eu</b> 和 <b>äu</b> 常读作 /ɔʏ̯/。看到这些组合时，把它们作为整体识别。</p>`,words:[['mein','/maɪ̯n/','我的'],['Liebe','/ˈliːbə/','爱'],['heute','/ˈhɔʏ̯tə/','今天'],['Häuser','/ˈhɔʏ̯zɐ/','房子（复数）']]},
{title:'第6课：重要辅音与特殊字母',goal:'认识德语 r、w、v、z、ß 等常见发音特点。',body:`<p>有些德语辅音和英语或汉语习惯不同。先记住常见规律，再通过单词和音频巩固。</p><ul><li><b>w</b> 通常读 /v/，类似英语 very 开头的辅音。</li><li><b>z</b> 通常读 /t͡s/，像“ts”连在一起。</li><li><b>ß</b> 读 /s/，名称是 Eszett；它不是字母 B。</li><li><b>v</b> 在许多常见德语词中读 /f/，但外来词可能不同。</li><li><b>r</b> 有多种地区变体，先学习标准德语常见读法即可。</li></ul>`,words:[['Wasser','/ˈvasɐ/','水'],['Zeit','/t͡saɪ̯t/','时间'],['Straße','/ˈʃtʁaːsə/','街道'],['Vater','/ˈfaːtɐ/','父亲']]},
{title:'第7课：常见字母组合 ch、sch、sp、st、pf',goal:'把常见组合当作发音单位练习。',body:`<p>德语里常见几个字母组合。<b>sch</b> 通常读 /ʃ/；词首 <b>sp</b> 常读 /ʃp/，词首 <b>st</b> 常读 /ʃt/；<b>pf</b> 是两个辅音连续发出。<b>ch</b> 有不同读法，受前面元音影响，后续还要专门训练。</p><p>先听完整单词，再拆分组合，最后连起来读。不要逐个念字母名称。</p>`,words:[['Schule','/ˈʃuːlə/','学校'],['sprechen','/ˈʃpʁɛçən/','说话'],['Straße','/ˈʃtʁaːsə/','街道'],['Pferd','/p͡feːɐ̯t/','马'],['Buch','/buːx/','书'],['ich','/ɪç/','我']]},
{title:'第8课：音节、重音与完整单词',goal:'找到单词重音，尝试把声音连成自然单词。',body:`<p>德语单词通常有一个主要重读音节。音标中的 <b>ˈ</b> 放在重读音节之前，例如 <b>Banane</b> <span class="ipa">/baˈnaːnə/</span>，重音落在第二个音节。</p><p>练习顺序：先听标准音频；再跟读音节；然后突出重读音节；最后用自然语速读完整单词。句子还需要学习节奏和语调，不能只把每个词孤立读准。</p>`,words:[['Banane','/baˈnaːnə/','香蕉'],['Familie','/faˈmiːli̯ə/','家庭'],['Guten Morgen','/ˈɡuːtn̩ ˈmɔʁɡn̩/','早上好']]}
];let phonIndex=0;function renderPhonetics(){let x=phonetics[phonIndex];document.getElementById('phonetics').innerHTML=`<div class="card"><div class="row between"><span class="pill">发音基础 · ${phonIndex+1}/8</span><span class="muted">A1正式课程前</span></div><h1 class="title">${x.title}</h1><p>${x.goal}</p><div class="explain">${x.body}</div><h2 class="section-title">本课发音词卡</h2>${x.words.map(w=>`<div class="vocab-item"><span class="word">${esc(w[0])}</span><span class="ipa">${esc(w[1])}</span><div>${esc(w[2])}</div><button class="secondary small" onclick="say(${JSON.stringify(w[0])},.72)">▶ 听标准德语系统朗读</button></div>`).join('')}<div class="notice">本构建包含少量 eSpeak 合成 MP3（机器语音，非母语者真人录音）；其他文本使用设备系统语音。iPhone Safari/PWA 的语音可用性因系统版本和语音资源而异。IPA示例是教学标注，后续仍需逐词校订。</div><div class="row between" style="margin-top:16px"><button class="secondary" ${phonIndex===0?'disabled':''} onclick="phonIndex--;renderPhonetics()">上一课</button><button onclick="if(phonIndex<7){phonIndex++;renderPhonetics()}else{state.phoneticsDone=true;persist();go('course')}">${phonIndex===7?'完成基础，进入A1':'下一课'}</button></div><p class="small muted">建议：每课先听，再看音标，最后模仿朗读。可以重复练习，不需要一次全部记住。</p></div>`}
function renderHome(){let n=lessons.filter(x=>completed(x.id)).length;document.getElementById('home').innerHTML=`<div class="hero"><div class="eyebrow" style="color:#e5d3a9">DEIN DEUTSCHWEG</div><h1 class="title">每天进步一点点。</h1><p>从零基础开始，稳步建立真正能用于德国生活与工作的德语能力。</p><div class="row"><button onclick="go('phonetics')">从发音基础开始</button><button onclick="go('course')">继续学习</button><button class="secondary" onclick="go('article')">今日分级阅读</button><button class="secondary" onclick="go('exam')">考试训练</button></div></div><div class="grid"><div class="stat"><span class="muted">完成课程</span><b>${n}/240</b></div><div class="stat"><span class="muted">错题待复习</span><b>${state.mistakes.filter(x=>!x.mastered).length}</b></div><div class="stat"><span class="muted">已掌握词汇</span><b>${Object.values(state.reviews).filter(x=>x.level>=2).length}</b></div><div class="stat"><span class="muted">测验次数</span><b>${state.scores.length}</b></div></div><div class="card"><div class="row between"><h2 class="section-title">今日课程</h2><span class="pill">${L().level}</span></div><h3>${L().title}</h3><p class="muted">${L().goal}</p><div class="progressbar"><span style="width:${(state.done[L().id]?.tasks||[]).filter(Boolean).length/6*100}%"></span></div><p class="small muted">${(state.done[L().id]?.tasks||[]).filter(Boolean).length}/6 项学习任务</p><button onclick="go('course')">进入课程</button></div><div class="card"><h2 class="section-title">你的学习路线</h2>${['A1','A2','B1','B2'].map(lv=>{let all=lessons.filter(x=>x.level===lv),done=all.filter(x=>completed(x.id)).length;return `<p class="row between"><b>${lv}</b><span class="muted">${done}/60 课</span></p><div class="progressbar"><span style="width:${done/60*100}%"></span></div>`}).join('')}</div><div class="notice">温和学习：中断后无需补打卡，也不会扣除进度。当前版本的课程数据仍需逐课编辑和校订；课程数量不代表每课都已达到完整教材标准。</div>`}function renderCourse(){let x=L(),tasks=state.done[x.id]?.tasks||[];let vocabHtml=x.vocab.map((v,i)=>`<div class="vocab-item"><div class="row between"><div><b>${esc(v[0])}</b><span class="ipa">${esc(x.vocab_ipa[i])}</span><div>${esc(v[1])} <span class="muted">· ${esc(v[2])}</span></div></div><button class="secondary" onclick="say(${JSON.stringify(v[0])})">▶</button></div></div>`).join('');let ex=x.examples.map((e,i)=>`<div class="example"><b>${esc(e[0])}</b><span class="ipa">${esc(x.examples_ipa[i])}</span><div class="translation">${esc(e[1])}</div><button class="secondary small" onclick="say(${JSON.stringify(e[0])})">▶ 播放</button></div>`).join('');document.getElementById('course').innerHTML=`<div class="row between"><button class="ghost" onclick="state.current=Math.max(1,xid()-1);renderCourse()">← 上一课</button><span class="pill">${x.level} · ${x.day}/60</span><button class="ghost" onclick="state.current=Math.min(240,xid()+1);renderCourse()">下一课 →</button></div><div class="card"><div class="eyebrow">LESSON ${x.id} / 240</div><h1 class="title">${esc(x.title)}</h1><p>${esc(x.goal)}</p><div class="notice"><b>本课语法主题：</b>${esc(x.grammar)}<br>第一次遇到语法术语时，请先理解它在句子中的作用，不必急着背定义。</div><h2 class="section-title">本课先理解</h2><div class="explain">${x.teaching?esc(x.teaching):'先复习本课目标，再学习词汇和例句。'}</div><h2 class="section-title">语法慢慢讲</h2><div class="notice">${x.grammar_detail?esc(x.grammar_detail):esc(x.grammar)}</div><h2 class="section-title">发音提醒</h2><p>${x.pronunciation_note?esc(x.pronunciation_note):'先听，再看 IPA，最后模仿。'}</p><h2 class="section-title">核心词汇 · 拼写 + IPA</h2>${vocabHtml}<h2 class="section-title">例句 · IPA + 中文</h2>${ex}<h2 class="section-title">真实情境对话</h2>${(x.dialogue||[]).map((d,i)=>`<div class="example"><b>${esc(d[0])}</b><span class="ipa">${esc(x.dialogue_ipa?.[i]||'')}</span><div class="translation">${esc(d[1])}</div><button class="secondary small" onclick="say(${JSON.stringify(d[0])},.78)">▶ 播放</button></div>`).join('')}<h2 class="section-title">口语任务</h2><p>${esc(x.oral)}<button class="secondary" onclick="say(${JSON.stringify(x.examples.map(e=>e[0]).join('. '))},.72)">▶ 慢速听本课例句</button><h2 class="section-title">写作任务</h2><p>${esc(x.writing)}</p><textarea id="lessonNote" placeholder="写下你的理解、问题或造句……">${esc(state.notes[x.id]||'')}</textarea><button class="secondary" onclick="saveNote()">保存笔记</button><h2 class="section-title">六项学习任务</h2>${['理解本课词汇与IPA','理解语法主题并读懂例句','听完整段德语并跟读','阅读例句并核对中文','独立完成口语表达','完成写作并自我检查'].map((t,i)=>`<label class="q"><input type="checkbox" ${tasks[i]?'checked':''} onchange="setTask(${i},this.checked)"> ${t}</label>`).join('')}<p class="muted">完成六项任务后，再进行本课测验。测验达到60%可记录课程通过。</p><button onclick="startQuiz(${x.id})">开始本课测验</button></div>`}function xid(){return +state.current||1}function setTask(i,v){let d=state.done[xid()]||{tasks:[],passed:false};d.tasks[i]=v;state.done[xid()]=d;localStorage.setItem(KEY,JSON.stringify(state));renderCourse();renderHome()}function saveNote(){state.notes[xid()]=document.getElementById('lessonNote').value;localStorage.setItem(KEY,JSON.stringify(state));alert('笔记已保存。')}function startQuiz(id){let x=L(id);state.current=id;let qs=[];x.vocab.forEach((v,i)=>{if(i<3){let options=[v[1],...x.vocab.filter((z,j)=>j!==i).slice(0,2).map(z=>z[1])];options=[...new Set(options)].sort(()=>Math.random()-.5);qs.push({q:`“${v[0]}”是什么意思？`,options,answer:options.indexOf(v[1]),why:`${v[0]} ${x.vocab_ipa[i]}：${v[1]}。`})}});let noun=x.vocab.find(v=>v[0].startsWith('der ')||v[0].startsWith('die ')||v[0].startsWith('das '));if(noun)qs.push({q:`请识别词组 “${noun[0]}” 的词性信息。`,options:['名词（含冠词）','动词','形容词'],answer:0,why:`${noun[0]} 是名词词组；请连同冠词一起记忆。`});qs.push({q:'本课学习时，哪种方法最有助于主动运用？',options:['只看中文答案','遮住翻译，自己回忆并造句','只播放音频，不看文字'],answer:1,why:'主动回忆、理解语境并自己造句，有助于把输入转化为输出。'});state.quiz={id,qs};renderQuiz()}function renderQuiz(){let qz=state.quiz;if(!qz)return;document.getElementById('course').innerHTML=`<div class="card"><div class="eyebrow">LESSON QUIZ</div><h1 class="title">第 ${qz.id} 课 · 课后测验</h1>${qz.qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join('')}</div>`).join('')}<button onclick="submitQuiz()">提交答案</button><button class="secondary" onclick="renderCourse()">返回课程</button><div id="quizResult"></div></div>`}function submitQuiz(){let qz=state.quiz,correct=0,review=[];qz.qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`),ok=!!a&&+a.value===q.answer;if(ok)correct++;else{let m={id:`${qz.id}-${i}`,lesson:qz.id,question:q.q,selected:a?q.options[+a.value]:'未作答',answer:q.options[q.answer],why:q.why,created:Date.now(),mastered:false};state.mistakes.unshift(m);review.push(m)}});let score=Math.round(correct/qz.qs.length*100);state.scores.push({lesson:qz.id,score,date:Date.now(),correct,total:qz.qs.length});if(score>=60){let d=state.done[qz.id]||{tasks:[true,true,true,true,true,true]};d.passed=true;state.done[qz.id]=d}localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('quizResult').innerHTML=`<div class="card"><h2>得分：${score}%</h2><p>${score>=60?'本课测验通过，已记录进度。':'还需要复习。错题已自动加入错题本。'}</p>${qz.qs.map((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`),ok=!!a&&+a.value===q.answer;return `<p><b>${ok?'✓':'✗'} ${esc(q.q)}</b><br>正确答案：${esc(q.options[q.answer])}<br><span class="muted">${esc(q.why)}</span></p>`}).join('')}<button onclick="go('practice')">去错题本复习</button><button class="secondary" onclick="go('course')">返回课程</button></div>`;renderHome()}function renderPractice(){let due=state.mistakes.filter(m=>!m.mastered);let daily=Object.entries(vocab).flatMap(([lv,arr])=>arr.map(v=>({lv,v}))).slice(0,20);document.getElementById('practice').innerHTML=`<div class="card"><h1 class="title">复习中心</h1><p class="muted">先回忆，再查看答案；答错的题目会自动进入错题本。</p><div class="grid"><div class="stat">待复习错题<b>${due.length}</b></div><div class="stat">累计错题<b>${state.mistakes.length}</b></div></div><h2 class="section-title">错题本</h2>${due.length?due.map(m=>`<div class="lesson-item"><b>${esc(m.question)}</b><p class="small danger-text">你的答案：${esc(m.selected)}</p><p>正确答案：<b>${esc(m.answer)}</b></p><p class="muted">${esc(m.why)}</p><button class="secondary" onclick="masterMistake('${m.id}')">标记已掌握</button></div>`).join(''):'<div class="empty">目前没有待复习错题。完成课程测验后，答错题目会自动出现在这里。</div>'}<h2 class="section-title">每日词汇</h2>${daily.slice(0,10).map(x=>`<div class="vocab-item"><b>${esc(x.v[0])}</b><span class="ipa">${esc(x.v[3]||'')}</span><div>${esc(x.v[1])} <span class="muted">· ${esc(x.v[2])} · ${x.lv}</span></div><button class="secondary small" onclick="say(${JSON.stringify(x.v[0])})">▶</button></div>`).join('')}</div>`}function masterMistake(id){let m=state.mistakes.find(x=>x.id===id);if(m)m.mastered=true;localStorage.setItem(KEY,JSON.stringify(state));renderPractice()}function renderLife(){document.getElementById('life').innerHTML=`<div class="card"><h1 class="title">德国生活 · 融入课程</h1><p class="muted">以下为学习主题入口，动态法律与签证信息需在学习时核对德国官方最新规定。</p>${[{t:'德国城市与日常生活',d:'认识城市、交通、超市、住房、垃圾分类和公共服务。',lv:'A1–A2'},{t:'求职与 Ausbildung',d:'逐步学习职业名称、招聘广告、简历、求职信、面试和双元制培训。',lv:'A1–B2'},{t:'Compliance 与职场',d:'从基础职场沟通逐步进入 AML/KYC、数据保护、风险报告等专业表达。',lv:'B1–B2'},{t:'社交、约会与 LGBTQ+ 生活',d:'练习交友、表达兴趣、尊重同意与边界、关系沟通和社群融入。',lv:'A1–B2'},{t:'网球与俱乐部',d:'学习约球、预约球场、训练沟通、比赛比分和赛事讨论。',lv:'A1–B2'}].map(x=>`<div class="lesson-item"><span class="pill">${x.lv}</span><h3>${x.t}</h3><p class="muted">${x.d}</p></div>`).join('')}<div class="notice">本页目前是主题导航与学习范围说明，不是完整的德国法律/移民咨询数据库，也不包含实时职位抓取。</div></div>`}function renderProfile(){let n=lessons.filter(x=>completed(x.id)).length,avg=state.scores.length?Math.round(state.scores.reduce((a,b)=>a+b.score,0)/state.scores.length):0;document.getElementById('profile').innerHTML=`<div class="card"><h1 class="title">我的学习档案</h1><div class="grid"><div class="stat">已通过课程<b>${n}/240</b></div><div class="stat">测验平均分<b>${avg||'—'}%</b></div><div class="stat">笔记数量<b>${Object.keys(state.notes).length}</b></div><div class="stat">错题总数<b>${state.mistakes.length}</b></div></div><h2 class="section-title">四级学习进度</h2>${['A1','A2','B1','B2'].map(lv=>{let all=lessons.filter(x=>x.level===lv),done=all.filter(x=>completed(x.id)).length;return `<p><b>${lv}</b>　${done}/60</p><div class="progressbar"><span style="width:${done/60*100}%"></span></div>`}).join('')}<h2 class="section-title">数据备份与恢复</h2><p class="muted">数据保存在当前浏览器。导出备份可保存到“文件”App；跨设备同步尚未接入。</p><button onclick="exportBackup()">导出学习备份</button><label class="btn secondary" style="display:inline-block;color:#173d32;background:#edf0e9">导入备份<input type="file" accept="application/json" onchange="importBackup(event)" hidden></label><h2 class="section-title">旧版数据迁移</h2><p class="muted">如果本浏览器仍保留 Deutsch Weg 3.0 的本地记录，可尝试读取并迁移完成课程、单词和笔记。迁移前建议先导出旧版备份。</p><button class="secondary" onclick="migrateV3()">检查并迁移3.0数据</button><p id="profileMsg" class="muted"></p><h2 class="section-title">版本说明</h2><p class="muted">当前构建：4.0整合测试版。已接入240个课程单元数据、发音入门、课后测验、错题本、本地学习档案、备份/恢复、旧版数据迁移入口、20节德国生活情境课，以及A1第10–13课内容重整。</p><p class="muted">仍未完成：其余课程的逐课原创内容和IPA人工校订；完整Goethe/telc官方结构模考；云端AI导师及长期记忆；专业音素级发音评分；跨设备同步；推送；实时职位/签证数据。普通语音识别不等于音素级发音评分。</p><p class="muted">课程IPA由本地语音工具自动生成，可能存在词重音/连读差异；重要词条需人工核对。课程例句目前有重复，后续内容校订会逐课替换。</p></div>`}function exportBackup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='Deutsch-Weg-4-backup.json';a.click();URL.revokeObjectURL(u)}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;state={...state,...d};localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('profileMsg').textContent='备份恢复成功。';renderProfile()}catch{document.getElementById('profileMsg').textContent='无法读取该备份文件。'}};r.readAsText(f)}function migrateV3(){try{let old=JSON.parse(localStorage.getItem('deutschWeg3')||'null');if(!old){document.getElementById('profileMsg').textContent='未在当前浏览器发现3.0数据。';return}if(old.done)Object.entries(old.done).forEach(([k,v])=>{if(/^\d+$/.test(k)&&Array.isArray(v)&&v.length===6&&v.every(Boolean))state.done[k]={tasks:v,passed:true}});if(old.notes)state.notes={...state.notes,...old.notes};if(old.scores)state.scores.push(...old.scores.map(score=>({lesson:0,score:Number(score)||0,date:Date.now()})));localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('profileMsg').textContent='迁移完成：已尝试导入旧版课程完成状态、笔记和测验分数。请核对进度。';renderProfile()}catch(e){document.getElementById('profileMsg').textContent='迁移失败：'+e.message}}function renderExam(){document.getElementById('exam').innerHTML=`<div class="card"><h1 class="title">考试训练</h1><div class="notice">目前提供分级练习入口与自测记录。以下内容不是Goethe/telc官方原题，也不等同于正式模考。</div><h2 class="section-title">B1 / B2 能力训练规划</h2><p>Lesen 阅读 · Hören 听力 · Schreiben 写作 · Sprechen 口语。完整考试计时、官方评分量表和经核验的模拟套题仍在开发。</p><button onclick="startQuiz(${Math.max(1,lessons.find(x=>x.level==='B1').id)})">开始B1课程知识自测</button><button class="secondary" onclick="startQuiz(${lessons.find(x=>x.level==='B2').id})">开始B2课程知识自测</button><h2 class="section-title">历史测验</h2>${state.scores.slice(-8).reverse().map(x=>`<p>${x.lesson?`第${x.lesson}课`:'迁移记录'} · ${x.score}% · ${new Date(x.date).toLocaleDateString()}</p>`).join('')||'<p class="muted">暂无测验记录。</p>'}</div>`}const articles={A1:{title:'Ein Tag in Berlin',de:'Hallo! Ich heiße Anna. Ich wohne in Berlin. Am Morgen trinke ich Kaffee und fahre mit dem Bus zur Arbeit. Am Abend spiele ich Tennis.',zh:'你好！我叫安娜。我住在柏林。早上我喝咖啡，乘公交车去上班。晚上我打网球。'},A2:{title:'Eine neue Wohnung',de:'Seit zwei Wochen suche ich eine neue Wohnung. Die Miete soll nicht zu hoch sein. Am Samstag besichtige ich eine Wohnung in der Nähe vom Bahnhof. Ich möchte den Vermieter nach den Nebenkosten fragen.',zh:'两周以来我一直在找新住房。房租不能太高。星期六我去看一套火车站附近的房子。我想询问房东附加费用。'},B1:{title:'Bewerbung und Berufserfahrung',de:'Bei einer Bewerbung ist es wichtig, die Anforderungen der Stellenanzeige genau zu prüfen. Man sollte seine Berufserfahrung mit konkreten Beispielen belegen und im Anschreiben erklären, warum man sich für das Unternehmen interessiert.',zh:'求职时，仔细检查招聘广告中的要求非常重要。应当用具体例子证明自己的工作经验，并在求职信中解释为什么对这家公司感兴趣。'},B2:{title:'Verantwortung und Compliance',de:'Ein wirksames Compliance-System beschränkt sich nicht auf formale Regeln. Entscheidend ist, Risiken frühzeitig zu erkennen, Verantwortlichkeiten klar zu definieren und Mitarbeitende durch verständliche Kommunikation in die Umsetzung einzubeziehen.',zh:'有效的合规体系不局限于形式规则。关键在于及早识别风险、明确责任，并通过清晰沟通让员工参与落实。'}};function renderArticle(){let lv=document.getElementById('articleLevel')?.value||'A1',x=articles[lv],tokens=[...new Set(x.de.match(/[A-Za-zÄÖÜäöüß]+/g)||[])].slice(0,20);document.getElementById('article').innerHTML=`<div class="card"><div class="row between"><h1 class="title">每日分级阅读</h1><select id="articleLevel" onchange="renderArticle()" style="width:auto">${['A1','A2','B1','B2'].map(v=>`<option ${v===lv?'selected':''}>${v}</option>`).join('')}</select></div><span class="pill">${lv}</span><h2>${x.title}</h2><p style="font-size:18px;line-height:1.9">${esc(x.de)}</p><button class="secondary" onclick="say(${JSON.stringify(x.de)},.8)">▶ 播放全文</button><h3 class="section-title">中文翻译</h3><p>${x.zh}</p><h3 class="section-title">阅读任务</h3><p>先不看翻译，尝试说出文章大意；再选择三个词，查明词义并造句。</p><button onclick="state.articlesRead.push({level:lv,date:Date.now()});localStorage.setItem(KEY,JSON.stringify(state));alert('已记录本次阅读。')">标记已读</button><p class="notice">说明：本页是各级示范短文。逐词IPA注释、文章库扩充及文章理解题仍需继续开发，不能把示范文章视为完整每日推送服务。</p></div>`}function goArticle(){go('article');renderArticle()}document.getElementById('home').addEventListener('click',e=>{if(e.target.closest('[onclick*="article"]'))setTimeout(renderArticle,0)});renderHome();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>

let dwLifeTopic='city'; let dwLifeLesson=-1;
