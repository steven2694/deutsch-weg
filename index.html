<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d32"><link rel="manifest" href="manifest.webmanifest"><title>Deutsch Weg 4.0</title><style>
:root{--g:#173d32;--bg:#f6f3e9;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24332d;font:16px/1.55 -apple-system,sans-serif}header{background:var(--g);color:white;padding:18px;font-size:22px;font-weight:bold}main{padding:16px 14px 90px;max-width:720px;margin:auto}.card,.hero{padding:17px;border-radius:17px;margin:12px 0;background:var(--paper);border:1px solid #e4e5da}.hero{background:var(--g);color:white}button{border:0;border-radius:10px;padding:11px 14px;margin:4px;background:#285c4b;color:white;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf7;display:flex;justify-content:space-around;padding:8px}.nav button{background:transparent;color:#285c4b;font-size:12px}.word{font-size:20px;font-weight:bold;color:#173d32}.ipa{color:#9b7134;font-size:14px}textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px}.muted{color:#718078;font-size:13px}.answer{display:block;width:100%;text-align:left;background:#edf0e9;color:#24332d}
</style></head><body><header>Deutsch Weg 4.0</header><main id="app"></main><nav class="nav"><button onclick="home()">首页</button><button onclick="course()">课程</button><button onclick="practice()">练习</button><button onclick="life()">德国生活</button><button onclick="profile()">我的</button></nav><script>
const key='deutschWeg4';let d;try{d=JSON.parse(localStorage.getItem(key))||{done:[],mistakes:[],journal:[]}}catch(e){d={done:[],mistakes:[],journal:[]}}function save(){localStorage.setItem(key,JSON.stringify(d))}
const words=[['Hallo','/ˈhaloː/','你好'],['Guten Morgen','/ˈɡuːtn̩ ˈmɔʁɡn̩/','早上好'],['Danke','/ˈdaŋkə/','谢谢'],['ich','/ɪç/','我'],['sein','/zaɪn/','是；处于'],['der Tennisball','/deːɐ̯ ˈtɛnɪsbal/','网球；阳性，复数 die Tennisbälle'],['die Stadt','/diː ʃtat/','城市；阴性，复数 die Städte']];
const lessons=[{title:'第一课：问候',intro:'先从最常见的问候开始。德语字母名称和发音会在后续基础发音课中逐步学习。',ids:[0,1,2],q:'Hallo 是什么意思？',opts:['再见','你好','谢谢'],a:1,why:'Hallo /ˈhaloː/ 是常见的非正式问候语。'},{title:'第二课：我与 sein',intro:'sein 表示“是/处于”。ich bin 表示“我是/我处于……”。',ids:[3,4],q:'“我是……”应该说？',opts:['Ich bist','Ich bin','Du bin'],a:1,why:'ich 与 sein 搭配时使用 bin。'},{title:'第三课：网球与城市',intro:'德语名词有语法性别，建议连同冠词一起记。',ids:[5,6],q:'Tennisball 的冠词是？',opts:['der','die','das'],a:0,why:'der Tennisball 是阳性名词。'}];
function render(t,s){document.getElementById('app').innerHTML='<h2>'+t+'</h2>'+s}function home(){render('Willkommen! 欢迎学习',`<section class="hero"><h1>每天进步一点点。</h1><p>从零基础出发，逐步走向B2。</p><p>已完成示范课：${d.done.length}/3</p><button onclick="course()">继续学习</button></section><div class="card"><b>今日小目标</b><p>认识三个问候语，并听读其中一个。</p><p class="muted">轻量学习也算进步，不因中断而惩罚自己。</p></div><div class="card">森林绿与暖象牙白界面 · iPhone优先 · 本地进度保存</div>`)}
function w(i){let x=words[i];return `<div class="card"><div class="word">${x[0]} <span class="ipa">${x[1]}</span></div><p>${x[2]}</p><button onclick="speak(${i})">▶ 听发音</button></div>`}
function speak(i){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(words[i][0]);u.lang='de-DE';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function course(){render('系统课程 · A1–B2',`<p class="muted">当前仅有三节A1示范课，不是完整A1–B2教材。</p>${lessons.map((x,i)=>`<div class="card"><h3>${x.title}</h3><p>${x.intro}</p><button onclick="lesson(${i})">${d.done.includes(i)?'复习':'开始学习'}</button></div>`).join('')}<div class="card">学习路径：A1基础沟通 → A2日常生活 → B1独立交流与求职 → B2专业表达与考试训练。</div>`)}
function lesson(i){let x=lessons[i];render(x.title,`<div class="card"><p>${x.intro}</p>${x.ids.map(w).join('')}</div><div class="card"><b>理解检查：${x.q}</b>${x.opts.map((o,j)=>`<button class="answer" onclick="check(${i},${j},this)">${o}</button>`).join('')}<p id="feedback"></p><button id="finish" disabled onclick="complete(${i})">完成课程</button></div>`)}
function check(i,j,b){let x=lessons[i];document.querySelectorAll('.answer').forEach(a=>a.disabled=true);document.getElementById('feedback').textContent=(j===x.a?'回答正确！':'再看一下：')+x.why;if(j!==x.a){d.mistakes.push({q:x.q,selected:x.opts[j],answer:x.opts[x.a],why:x.why});save()}document.getElementById('finish').disabled=false}
function complete(i){if(!d.done.includes(i))d.done.push(i);save();course()}
function practice(){render('词汇复习与错题本',`<h3>基础词汇</h3>${words.map((x,i)=>w(i)).join('')}<div class="card"><h3>错题（${d.mistakes.length}）</h3>${d.mistakes.map(x=>`<p>${x.q}<br>你的答案：${x.selected}；正确答案：${x.answer}<br>${x.why}</p>`).join('')||'目前没有错题。'}</div>`)}
function life(){render('德国生活 · 职业 · 兴趣',`<div class="card"><h3>职业发展</h3><p>A1认识职业；A2读懂简单岗位信息；B1练习简历、求职信和面试；B2学习专业沟通、岗位分析与案例表达。</p><p>主题：Ausbildung、直接就业、Compliance、德国职场。</p></div><div class="card"><h3>生活与社交</h3><p>德国城市、住房交通、文化、LGBTQ+社群、约会沟通、网球俱乐部和赛事。</p><p class="muted">签证、劳动法、学历认可等动态信息需核对德国官方最新资料。</p></div><div class="card"><h3>德语成长日记</h3><textarea id="entry" placeholder="Heute habe ich ..."></textarea><button onclick="addEntry()">保存日记</button>${d.journal.map(x=>`<p>${x}</p>`).join('')}</div>`)}
function addEntry(){let x=document.getElementById('entry').value.trim();if(x){d.journal.unshift(new Date().toLocaleDateString()+' · '+x);save();life()}}
function profile(){render('我的学习档案',`<div class="card">完成课程：${d.done.length} · 错题：${d.mistakes.length}</div><div class="card"><button onclick="backup()">导出进度备份</button><input type="file" id="file" accept="application/json"><button onclick="restore()">导入备份</button></div><div class="card"><b>当前版本说明</b><p>已实现：少量A1示范课、IPA词汇、系统TTS、课程测验、错题收集、本地进度和日记。</p><p>未实现：完整240课、B1/B2完整模考、AI导师与云端记忆、专业音素级发音评分、跨设备同步、推送通知和实时资料。</p><p class="muted">本版本不会自动迁移3.0数据。普通语音识别不等于专业发音评测。</p></div>`)}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.href=u;a.download='Deutsch_Weg_backup.json';a.click();URL.revokeObjectURL(u)}
function restore(){let f=document.getElementById('file').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();profile()}catch(e){alert('备份文件无法读取')}};r.readAsText(f)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});home();
</script></main></body></html>
